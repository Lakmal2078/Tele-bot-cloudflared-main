name = "xbet-telegram-bot"
main = "src/worker.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

# ─── Plain text variables (non-sensitive) ───
[vars]
BOT_MODE = "webhook"
CHANNEL_URL = "https://t.me"
CHANNEL_USERNAME = "@fastxbetcash_bot"
DEPOSIT_INSTRUCTIONS = "Deposit to the following account"
MAX_TRANSACTION_LKR = "500000"
MIN_TRANSACTION_LKR = "1000"
R2_BUCKET_NAME = "chat-media"
USE_POLLING = "false"
XBET_LINK = "https://reffpa.com"
XBET_PROMO_CODE = "VGSL"

# ─── Required secrets (set via: npx wrangler secret put <NAME>) ───
# පහත values ටික wrangler.toml එකේ දාන්න එපා — වෙනම secret විදියට set කරන්න:
#
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_CHANNEL_ID
#   npx wrangler secret put ADMIN_IDS
#   npx wrangler secret put BANK_DETAILS
#   npx wrangler secret put WHATSAPP_NUMBER
#   npx wrangler secret put EZCASH_NUMBER
#   npx wrangler secret put FRIMI_NUMBER
#   npx wrangler secret put MCASH_NUMBER
#   npx wrangler secret put R2_ACCOUNT_ID
#   npx wrangler secret put R2_PUBLIC_DOMAIN

[[d1_databases]]
binding = "DB"
database_name = "fastxbetcash_bot-db"
database_id = "7a821498-be68-4a0f-a630-e9334238c1fe"

[[r2_buckets]]
binding = "CHAT_MEDIA"
bucket_name = "chat-media"

[triggers]
crons = ["0 2 * * *"]


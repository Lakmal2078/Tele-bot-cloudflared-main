name = "xbet-telegram-bot"
main = "src/worker.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Cloudflare Workers Static Assets (Landing Page & SEO)
[assets]
directory = "./public"
binding = "ASSETS"

# Environment Variables ([vars])
# NOTE: Personal contact numbers, bank details, WhatsApp number, and 1xBet
# affiliate credentials are intentionally NOT stored here. They are configured
# as Cloudflare Secrets (runtime env works identically) so that no personal or
# partner-sensitive data is committed to source control.
# Provision them with: npm run secrets:cf   (scripts/setup-cf-secrets.sh)
[vars]
BOT_MODE = "production"
USE_POLLING = "false"
PUBLIC_BASE_URL = "https://xbet-telegram-bot.agent-1xfast-srilanka.workers.dev"
BOT_USERNAME = "fast_1xbetcash_bot"

# Telegram Channel (public channel identity — not sensitive)
CHANNEL_URL = "https://t.me/fast_xbet_official_tips"
CHANNEL_USERNAME = "@fast_xbet_official_tips"

# Customer Support / Payment rails → set via Cloudflare Secrets:
#   EZCASH_NUMBER, MCASH_NUMBER, FRIMI_NUMBER, IPAY_NUMBER,
#   BANK_DETAILS, WHATSAPP_NUMBER, XBET_LINK, XBET_PROMO_CODE,
#   SECURITY_CODE_PEPPER (see scripts/setup-cf-secrets.sh)

# Limits & Instructions
MIN_TRANSACTION_LKR = "1000"
MAX_TRANSACTION_LKR = "500000"
DEPOSIT_INSTRUCTIONS = "📌 තැන්පතු උපදෙස්\n1) ගෙවීම් ක්‍රමය තෝරන්න (BOC / People's / Sampath / LOLC / eZ Cash / iPay / FriMi)\n2) ලබා දෙන ගිණුමට හෝ අංකයට මුදල් යවන්න\n3) ගෙවීම් receipt / screenshot එක bot එකට එවන්න\n4) Admin approve කළ පසු 1xBet balance එකට credit වේ\n⚠️ අවම: රු. 1,000 | උපරිම: රු. 500,000\n⚠️ 18+ පමණි. වගකීමෙන් යුතුව ක්‍රීඩා කරන්න."

# Automated Free Sports Betting Tips (Sri Lanka UTC+05:30)
TIPS_CHANNEL_ID = "-1004336999467"
TIPS_CHANNEL_URL = "https://t.me/fast_xbet_official_tips"
TIPS_SPORTS = "soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_uefa_champs_league,cricket_international_t20,basketball_nba,auto:table_tennis,auto:esports"
TIPS_ODDS_REGIONS = "eu"
TIPS_MIN_ODDS = "1.30"
TIPS_MAX_ODDS = "3.00"
TIPS_HOURS_AHEAD = "72"
TIPS_PER_SLOT = "3"
TIPS_MAX_FEEDS = "4"
TIPS_MIN_CONSENSUS = "0.42"
TIPS_MIN_VALUE = "0.003"
TIPS_MIN_BOOKMAKERS = "2"
TIPS_MAX_STALE_HOURS = "24"

# Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "fastxbetcash_bot-db"
database_id = "7a821498-be68-4a0f-a630-e9334238c1fe"

# Cloudflare R2 Media Bucket Binding
[[r2_buckets]]
binding = "CHAT_MEDIA"
bucket_name = "chat-media"

# Workers Observability — persist console logs for tips cron debugging
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# Automated Cron Triggers
# 02:00 UTC = cleanup, 02:30/06:30/12:30 UTC = Free Tips (08:00/12:00/18:00 SL), 15 * * * * = Hourly settlement
[triggers]
crons = ["0 2 * * *", "30 2 * * *", "30 6 * * *", "30 12 * * *", "15 * * * *"]

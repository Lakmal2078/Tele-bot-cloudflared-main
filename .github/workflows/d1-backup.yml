name: Manual D1 backup

on:
  workflow_dispatch:
  schedule:
    # දිනපතා UTC 18:15 (ශ්‍රී ලංකා වෙලාව 23:45) backup එකක් ස්වයංක්‍රීයව ගනී
    - cron: "15 18 * * *"

permissions:
  contents: read

concurrency:
  group: production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export production D1 to private R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-backup
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: fastxbetcash_bot-db
      BACKUP_BUCKET: xbet-bot-backups-private
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Wrangler
        run: npm ci

      - name: Export, compress, and verify D1 backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          # තාවකාලික SQL ගොනු runner user ට පමණක් සීමා කිරීම (Security)
          umask 077

          # Environment secrets නොමැති නම් ආරම්භයේදීම පැහැදිලි දෝෂයක් පෙන්වීම
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN in production-backup environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID in production-backup environment}"

          backup_dir="$RUNNER_TEMP/d1-backup"
          mkdir -p "$backup_dir"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          sql_file="$backup_dir/database.sql"
          archive="$backup_dir/d1-${timestamp}.sql.gz"

          # Job එක අවසන් වූ විගස තාවකාලික backup ගොනු මකා දැමීම
          cleanup() {
            rm -rf "$backup_dir"
          }
          trap cleanup EXIT

          echo "::group::1. Export remote D1 database"
          npx wrangler d1 export "$DATABASE_NAME" --remote --skip-confirmation --output="$sql_file"
          test -s "$sql_file"
          echo "::endgroup::"

          echo "::group::2. Compress and generate checksum/manifest"
          # gzip -9 "$sql_file" මගින් database.sql.gz සෑදෙන නිසා, archive නම ට හරියටම ලිවීමට -c භාවිතා කරයි
          gzip -9 -c "$sql_file" > "$archive"
          test -s "$archive"

          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$(basename "$archive")" > "$archive.sha256"

          jq -n \
            --arg database "$DATABASE_NAME" \
            --arg bucket "$BACKUP_BUCKET" \
            --arg createdAt "$timestamp" \
            --arg commit "$GITHUB_SHA" \
            --arg archive "$(basename "$archive")" \
            --arg sha256 "$checksum" \
            --arg workflowRun "$GITHUB_RUN_ID" \
            '{database:$database,bucket:$bucket,createdAtUtc:$createdAt,commit:$commit,archive:$archive,sha256:$sha256,workflowRun:$workflowRun}' \
            > "$archive.json"
          echo "::endgroup::"

          echo "::group::3. Upload artifacts to remote private R2 bucket"
          key="backups/d1/$timestamp"
          # Wrangler v4 හි සැබෑ R2 bucket එකට upload කිරීමට --remote අනිවාර්ය වේ
          npx wrangler r2 object put "$BACKUP_BUCKET/$key/$(basename "$archive")" --remote --file="$archive" --content-type=application/gzip
          npx wrangler r2 object put "$BACKUP_BUCKET/$key/$(basename "$archive").sha256" --remote --file="$archive.sha256" --content-type=text/plain
          npx wrangler r2 object put "$BACKUP_BUCKET/$key/$(basename "$archive").json" --remote --file="$archive.json" --content-type=application/json
          echo "::endgroup::"

          echo "::group::4. Roundtrip download and SHA-256 verification"
          npx wrangler r2 object get "$BACKUP_BUCKET/$key/$(basename "$archive")" --remote --file="$backup_dir/roundtrip.sql.gz"
          remote_checksum="$(sha256sum "$backup_dir/roundtrip.sql.gz" | awk '{print $1}')"
          test "$checksum" = "$remote_checksum"
          echo "::endgroup::"

          echo "Backup uploaded and verified: $key"
          echo "SHA-256: $checksum"

name: One-time OG metadata cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Remove legacy PNG from landing-page metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/landingPage.ts';
          let s = fs.readFileSync(path, 'utf8');
          const before = s;
          s = s.replace('logo:`${url}og-image.png`,image:`${url}og-image.jpg`', 'logo:`${url}og-image.jpg`,image:`${url}og-image.jpg`');
          s = s.replace('<meta property="og:image" content="${esc(url+"og-image.png?v=2")}"><meta property="og:image:secure_url" content="${esc(url+"og-image.png?v=2")}"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">', '');
          if (s === before) throw new Error('Expected OG metadata patterns were not found');
          fs.writeFileSync(path, s);

          const testPath = 'tests/landingPage.test.ts';
          let t = fs.readFileSync(testPath, 'utf8');
          const testBefore = t;
          t = t.replace('    expect(html).toContain(\'<meta property="og:image" content="https://fast-xbet.lk/og-image.png?v=2">\');\n', '');
          t = t.replace('    expect(html).toContain(\'<meta property="og:image:secure_url" content="https://fast-xbet.lk/og-image.png?v=2">\');\n', '');
          t = t.replace('    expect(html).toContain(\'<meta property="og:image:type" content="image/png">\');\n', '');
          if (t !== testBefore) fs.writeFileSync(testPath, t);
          NODE

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/landingPage.ts tests/landingPage.test.ts
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: make JPEG the sole canonical OG image"
          git push origin main

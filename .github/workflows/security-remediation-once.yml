name: One-time CodeQL remediation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    name: Apply CodeQL-safe logging and input fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/utils.ts": [
                  (
                      'return String(text).replace(/([_*`[])/g, "\\\\$1");',
                      'return String(text).replace(/([_*`\\[])/g, "\\\\$1");',
                  ),
              ],
              "src/tips.ts": [
                  (
                      '''  } catch {\n    const sep = raw.includes("?") ? "&" : "?";\n    return `${raw}${sep}match=${encodeURIComponent(matchName)}&event_id=${encodeURIComponent(candidate.event.id)}`;\n  }''',
                      '''  } catch {\n    const fallback = new URL(DEFAULT_XBET_LINK);\n    fallback.searchParams.set("match", matchName);\n    fallback.searchParams.set("event_id", candidate.event.id);\n    if (candidate.selection) fallback.searchParams.set("pick", candidate.selection);\n    if (candidate.event.sport_key) fallback.searchParams.set("sport", candidate.event.sport_key);\n    return fallback.toString();\n  }''',
                  ),
              ],
              "src/r2.ts": [
                  (
                      '    console.log(`[R2] Receipt stored: ${r2Url} (${fileSize} bytes)`);',
                      '    console.log("[R2] Receipt stored successfully.");',
                  ),
              ],
              "src/bot.ts": [
                  (
                      '      console.warn(`[Force-Join] "${clean}" is a bot username, not a channel. Bypassing check.`);',
                      '      console.warn("[Force-Join] Configured target is a bot username; bypassing check.");',
                  ),
                  (
                      '        console.warn(`[Force-Join] "${clean}" is a private chat, not a channel/group. Bypassing check.`);',
                      '        console.warn("[Force-Join] Configured target is a private chat; bypassing check.");',
                  ),
                  (
                      '      console.warn(`[Force-Join] Could not verify channel membership for ${clean} (${err?.description || err?.message || err}). Bypassing.`);',
                      '      console.warn("[Force-Join] Could not verify channel membership; bypassing check.");',
                  ),
                  (
                      '      console.log(`[Admin Channel] Successfully sent R2 upload notification to ${adminChannel} for user ${userInfo.id}`);',
                      '      console.log("[Admin Channel] R2 upload notification sent successfully.");',
                  ),
                  (
                      '      console.warn(`[Admin Channel] Failed to send R2 upload notification to ${adminChannel}:`, channelErr?.message || channelErr);',
                      '      console.warn("[Admin Channel] Failed to send R2 upload notification.");',
                  ),
                  (
                      '          console.error(`[Admin Channel] Fallback message also failed:`, retryErr);',
                      '          console.error("[Admin Channel] Fallback notification also failed.");',
                  ),
                  (
                      '        console.log(`[Admin Channel] Successfully logged deposit #${requestId} to ${adminChannel}`);',
                      '        console.log("[Admin Channel] Deposit notification sent successfully.");',
                  ),
                  (
                      '        console.warn(`[Admin Channel] Could not log to channel ${adminChannel}:`, channelErr?.message || channelErr);',
                      '        console.warn("[Admin Channel] Deposit notification failed.");',
                  ),
                  (
                      '        console.error(`Failed to alert admin ${adminId}:`, err);',
                      '        console.error("[Admin] Deposit alert delivery failed.");',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly 1 occurrence, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Verify no targeted sensitive log patterns remain
        run: |
          ! grep -nE 'console\.(log|warn|error).*\$\{(clean|adminChannel|userInfo\.id|requestId|adminId|r2Url)|console\.(log|warn|error).*channelErr|console\.(log|warn|error).*retryErr' src/bot.ts src/r2.ts

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils.ts src/tips.ts src/bot.ts src/r2.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: remediate CodeQL security alerts"
          git push origin main

      - name: Remove this temporary workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/security-remediation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time CodeQL remediation workflow"
          git push origin main

name: Apply public favicon asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: add temporary favicon asset switch workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch page favicons to the public PNG asset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "src/landingPage.ts": [
                  (
                      'import { BRAND_LOGO_SVG_COMPACT, BRAND_LOGO_FAVICON_DATA_URI } from "./brandLogo";',
                      'import { BRAND_LOGO_SVG_COMPACT } from "./brandLogo";',
                  ),
                  (
                      '<link rel="icon" type="image/svg+xml" href="${BRAND_LOGO_FAVICON_DATA_URI}">',
                      '<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">',
                  ),
              ],
              "src/adminPage.ts": [
                  (
                      'import { BRAND_LOGO_SVG_COMPACT, BRAND_LOGO_FAVICON_DATA_URI } from "./brandLogo";',
                      'import { BRAND_LOGO_SVG_COMPACT } from "./brandLogo";',
                  ),
                  (
                      '<link rel="icon" type="image/svg+xml" href="${BRAND_LOGO_FAVICON_DATA_URI}">',
                      '<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {name}: {old}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"No changes made to {name}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit favicon integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/landingPage.ts src/adminPage.ts
          git commit -m "chore: use public favicon asset"
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-favicon-asset.yml
          git commit -m "chore: remove temporary favicon asset workflow"
          git push origin main

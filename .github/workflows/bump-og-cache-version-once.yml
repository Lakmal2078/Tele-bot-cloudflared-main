name: One-time OG cache version bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump canonical OG image cache version
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const path of ['src/landingPage.ts', 'tests/landingPage.test.ts']) {
            const before = fs.readFileSync(path, 'utf8');
            const after = before.replaceAll('og-image.jpg?v=2', 'og-image.jpg?v=3');
            if (after === before) throw new Error(`Expected v=2 OG image URL not found in ${path}`);
            fs.writeFileSync(path, after);
          }
          NODE

      - name: Commit cache-version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/landingPage.ts tests/landingPage.test.ts
          git commit -m "fix: bump OG image cache version"
          git push origin main

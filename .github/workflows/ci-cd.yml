name: CI/CD

# ═══════════════════════════════════════════════════════════════════════
#  XBet Telegram Bot — CI/CD Pipeline
#
#  Safety contract (matches deploy.sh):
#  - CI is the single production deployment path.
#  - Wrangler is pinned by package.json/package-lock.json; never `latest`.
#  - D1 migrations are validated before application and must be
#    backward-compatible. Breaking migrations are blocked.
#  - Quality gates (lint, tests, migration validation) cannot be skipped.
#  - Migrations are applied before Worker deployment.
#
#  Required GitHub repository secrets:
#    CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit, D1:Edit,
#                             R2:Edit permissions for this account
#    CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account ID
#                             (5e881675f6e48904761848cfbf3b44b8)
# ═══════════════════════════════════════════════════════════════════════

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Exactly one production deployment path. Never cancel an in-flight production deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate migrations
        run: npm run validate:migrations

      - name: Validate deployment script
        run: bash -n deploy.sh

  deploy:
    name: Deploy production Worker
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        run: npm run deploy:cf:ci
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        run: npm run deploy:cf:ci
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


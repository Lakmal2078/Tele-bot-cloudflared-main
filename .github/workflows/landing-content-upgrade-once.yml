name: One-time landing content upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.event.head_commit.message != 'feat: upgrade landing page customer content' && github.event.head_commit.message != 'chore: remove one-time landing content workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply landing page upgrade

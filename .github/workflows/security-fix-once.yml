name: Apply CodeQL security fixes once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: resolve CodeQL security alerts')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source-level security fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(from)) {
              throw new Error(`Expected source pattern not found in ${path}`);
            }
            const next = text.replace(from, to);
            fs.writeFileSync(path, next);
          }

          // CodeQL: incomplete string escaping. Escape the literal '[' correctly.
          replaceOnce(
            'src/utils.ts',
            'return String(text).replace(/([_*`[])/g, "\\\\$1");',
            'return String(text).replace(/([_*`\\[])/g, "\\\\$1");'
          );

          // CodeQL: never append attacker-controlled input after URL parsing fails.
          replaceOnce(
            'src/tips.ts',
            '  } catch {\n    const sep = raw.includes("?") ? "&" : "?";\n    return `${raw}${sep}match=${encodeURIComponent(matchName)}&event_id=${encodeURIComponent(candidate.event.id)}`;\n  }',
            '  } catch {\n    const safeUrl = new URL(DEFAULT_XBET_LINK);\n    safeUrl.searchParams.set("match", matchName);\n    safeUrl.searchParams.set("event_id", candidate.event.id);\n    if (candidate.selection) safeUrl.searchParams.set("pick", candidate.selection);\n    return safeUrl.toString();\n  }'
          );

          // CodeQL: do not log channel identifiers, user IDs, URLs, or Telegram error payloads.
          replaceOnce(
            'src/r2.ts',
            '    console.log(`[R2] Receipt stored: ${r2Url} (${fileSize} bytes)`);',
            '    console.log(`[R2] Receipt stored successfully (${fileSize} bytes)`);'
          );

          replaceOnce(
            'src/bot.ts',
            '      console.warn(`[Force-Join] "${clean}" is a bot username, not a channel. Bypassing check.`);',
            '      console.warn("[Force-Join] Configured force-join target is a bot username; bypassing check.");'
          );

          replaceOnce(
            'src/bot.ts',
            '        console.warn(`[Force-Join] "${clean}" is a private chat, not a channel/group. Bypassing check.`);',
            '        console.warn("[Force-Join] Configured force-join target is a private chat; bypassing check.");'
          );

          replaceOnce(
            'src/bot.ts',
            '      console.warn(`[Force-Join] Could not verify channel membership for ${clean} (${err?.description || err?.message || err}). Bypassing.`);',
            '      console.warn("[Force-Join] Could not verify channel membership; bypassing check.");'
          );

          replaceOnce(
            'src/bot.ts',
            '      console.log(`[Admin Channel] Successfully sent R2 upload notification to ${adminChannel} for user ${userInfo.id}`);',
            '      console.log("[Admin Channel] R2 upload notification sent successfully.");'
          );

          replaceOnce(
            'src/bot.ts',
            '      console.warn(`[Admin Channel] Failed to send R2 upload notification to ${adminChannel}:`, channelErr?.message || channelErr);',
            '      console.warn("[Admin Channel] Failed to send R2 upload notification.");'
          );

          replaceOnce(
            'src/bot.ts',
            '        console.log(`[Admin Channel] Successfully logged deposit #${requestId} to ${adminChannel}`);',
            '        console.log("[Admin Channel] Deposit notification sent successfully.");'
          );

          replaceOnce(
            'src/bot.ts',
            '        console.warn(`[Admin Channel] Could not log to channel ${adminChannel}:`, channelErr?.message || channelErr);',
            '        console.warn("[Admin Channel] Could not send deposit notification.");'
          );

          // Prevent the one-shot fixer from silently masking a partial change.
          for (const [path, needles] of Object.entries({
            'src/utils.ts': ['replace(/([_*`\\[])/g'],
            'src/tips.ts': ['const safeUrl = new URL(DEFAULT_XBET_LINK);'],
            'src/r2.ts': ['Receipt stored successfully'],
            'src/bot.ts': ['R2 upload notification sent successfully.', 'Deposit notification sent successfully.'],
          })) {
            const text = fs.readFileSync(path, 'utf8');
            for (const needle of needles) {
              if (!text.includes(needle)) throw new Error(`Verification failed for ${path}: ${needle}`);
            }
          }
          NODE

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-fix-once.yml
          git add src/utils.ts src/tips.ts src/r2.ts src/bot.ts
          git commit -m "fix: resolve CodeQL security alerts"
          git push origin main
